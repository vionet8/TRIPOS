<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRIPOS｜家族の移動を、まるごと設計する。</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand:    '#F97316',
            branddark:'#EA6C0A',
            navy:     '#1B3A6B',
            navylight:'#2A5298',
            teal:     '#2AB4A0',
            tealdark: '#1E9B89',
            cream:    '#FFFBF5',
          },
          fontFamily: { sans: ['"Noto Sans JP"', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; }
    .score-bar { height:6px; border-radius:3px; background:#E5E7EB; overflow:hidden; }
    .score-fill { height:100%; border-radius:3px; }
    .card-enter { animation: cardIn 0.4s ease forwards; opacity:0; transform:translateY(16px); }
    @keyframes cardIn { to { opacity:1; transform:translateY(0); } }
    .spinner { border:3px solid #E5E7EB; border-top:3px solid #2AB4A0; border-radius:50%; width:32px; height:32px; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    select, input, textarea { -webkit-appearance:none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-navy text-white px-5 py-3 flex items-center gap-3 shadow-lg sticky top-0 z-50">
    <span class="text-xl">🧭</span>
    <div>
      <p class="font-black tracking-tight text-base leading-tight">TRIPOS</p>
      <p class="text-white/50 text-xs leading-none">家族の移動を、まるごと設計する。</p>
    </div>
    <a href="/lp" class="ml-auto text-white/50 text-xs hover:text-white/80 transition-colors">LPを見る</a>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-8">

    <!-- 入力フォーム -->
    <div id="formSection">
      <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 mb-6">
        <h2 class="font-black text-navy text-lg mb-1">旅のルートを入力</h2>
        <p class="text-xs text-gray-400 mb-5">AIが最適な宿泊エリアを逆算提案します</p>

        <form id="mainForm" class="space-y-4">

          <!-- 出発地・目的地 -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">📍 出発地 <span class="text-brand">*</span></label>
              <input id="origin" type="text" placeholder="例：宇都宮" required
                class="w-full border border-gray-200 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal/30 focus:border-teal" />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">🏁 目的地 <span class="text-brand">*</span></label>
              <input id="destination" type="text" placeholder="例：大阪" required
                class="w-full border border-gray-200 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal/30 focus:border-teal" />
            </div>
          </div>

          <!-- 旅の目的 -->
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-2">🎯 旅の目的 <span class="text-brand">*</span></label>
            <div class="grid grid-cols-4 gap-2" id="purposeButtons">
              <button type="button" data-value="観光" onclick="selectPurpose(this)"
                class="purpose-btn border-2 border-gray-200 rounded-xl py-3 text-center text-xs font-bold text-gray-600 hover:border-teal hover:text-teal transition-colors">
                🏯<br/>観光
              </button>
              <button type="button" data-value="グルメ" onclick="selectPurpose(this)"
                class="purpose-btn border-2 border-gray-200 rounded-xl py-3 text-center text-xs font-bold text-gray-600 hover:border-teal hover:text-teal transition-colors">
                🍜<br/>グルメ
              </button>
              <button type="button" data-value="温泉" onclick="selectPurpose(this)"
                class="purpose-btn border-2 border-gray-200 rounded-xl py-3 text-center text-xs font-bold text-gray-600 hover:border-teal hover:text-teal transition-colors">
                ♨️<br/>温泉
              </button>
              <button type="button" data-value="レジャー" onclick="selectPurpose(this)"
                class="purpose-btn border-2 border-gray-200 rounded-xl py-3 text-center text-xs font-bold text-gray-600 hover:border-teal hover:text-teal transition-colors">
                🎡<br/>レジャー
              </button>
            </div>
            <input type="hidden" id="purpose" required />
          </div>

          <!-- 日程・泊数 -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">📅 出発日 <span class="text-brand">*</span></label>
              <input id="travel_date" type="date" required
                class="w-full border border-gray-200 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal/30 focus:border-teal" />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">🌙 泊数</label>
              <select id="nights"
                class="w-full border border-gray-200 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal/30 focus:border-teal bg-white">
                <option value="1">1泊2日</option>
                <option value="2">2泊3日</option>
                <option value="3">3泊4日</option>
              </select>
            </div>
          </div>

          <!-- 人数 -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">👨‍👩‍👧 大人の人数</label>
              <select id="adults"
                class="w-full border border-gray-200 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal/30 focus:border-teal bg-white">
                <option value="1">1人</option>
                <option value="2" selected>2人</option>
                <option value="3">3人</option>
                <option value="4">4人以上</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">🧒 子供の年齢</label>
              <input id="children" type="text" placeholder="例：3歳・6歳"
                class="w-full border border-gray-200 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal/30 focus:border-teal" />
            </div>
          </div>

          <!-- 予算 -->
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-2">💴 予算感（1人/泊）</label>
            <div class="grid grid-cols-4 gap-2">
              <label class="budget-opt cursor-pointer">
                <input type="radio" name="budget" value="budget" class="hidden" />
                <div class="border-2 border-gray-200 rounded-xl py-2 text-center text-xs font-bold text-gray-500 hover:border-teal transition-colors budget-label">
                  節約<br/><span class="text-gray-400 font-normal">〜8,000円</span>
                </div>
              </label>
              <label class="budget-opt cursor-pointer">
                <input type="radio" name="budget" value="mid" class="hidden" checked />
                <div class="border-2 border-teal rounded-xl py-2 text-center text-xs font-bold text-teal budget-label">
                  標準<br/><span class="font-normal">〜15,000円</span>
                </div>
              </label>
              <label class="budget-opt cursor-pointer">
                <input type="radio" name="budget" value="premium" class="hidden" />
                <div class="border-2 border-gray-200 rounded-xl py-2 text-center text-xs font-bold text-gray-500 hover:border-teal transition-colors budget-label">
                  プレミアム<br/><span class="text-gray-400 font-normal">〜25,000円</span>
                </div>
              </label>
              <label class="budget-opt cursor-pointer">
                <input type="radio" name="budget" value="luxury" class="hidden" />
                <div class="border-2 border-gray-200 rounded-xl py-2 text-center text-xs font-bold text-gray-500 hover:border-teal transition-colors budget-label">
                  贅沢<br/><span class="text-gray-400 font-normal">25,000円〜</span>
                </div>
              </label>
            </div>
          </div>

          <button type="submit" id="submitBtn"
            class="w-full bg-navy text-white font-black text-base py-4 rounded-2xl hover:bg-navylight transition-colors shadow-lg mt-2">
            🧭 最適なエリアを提案してもらう
          </button>
        </form>
      </div>
    </div>

    <!-- ローディング -->
    <div id="loadingSection" class="hidden text-center py-16">
      <div class="spinner mx-auto mb-5"></div>
      <p class="font-bold text-navy text-base mb-1">AIがルートを解析中...</p>
      <p class="text-xs text-gray-400">125エリアのデータベースと照合しています</p>
    </div>

    <!-- 結果 -->
    <div id="resultSection" class="hidden">
      <!-- ルートサマリー -->
      <div id="routeSummary" class="bg-navy text-white rounded-2xl p-4 mb-5">
        <div class="flex items-center gap-3 mb-2">
          <span class="text-2xl">🧭</span>
          <div>
            <p id="routeLabel" class="font-black text-base"></p>
            <p id="routeComment" class="text-white/60 text-xs mt-0.5"></p>
          </div>
        </div>
        <button onclick="resetForm()" class="text-white/50 text-xs hover:text-white/80 transition-colors mt-1">← 条件を変更する</button>
      </div>

      <!-- エリアカード -->
      <div id="areaCards" class="space-y-4 mb-6"></div>

      <!-- 再提案ボタン -->
      <div class="text-center">
        <button onclick="resetForm()" class="bg-white border-2 border-navy text-navy font-bold px-8 py-3 rounded-2xl hover:bg-navy hover:text-white transition-colors">
          ← 条件を変えて再提案
        </button>
      </div>
    </div>

    <!-- エラー -->
    <div id="errorSection" class="hidden">
      <div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
        <p class="text-4xl mb-3">😓</p>
        <p class="font-bold text-red-700 mb-1">提案に失敗しました</p>
        <p id="errorMsg" class="text-xs text-red-500 mb-4"></p>
        <button onclick="resetForm()" class="bg-red-600 text-white font-bold px-6 py-2 rounded-xl text-sm">もう一度試す</button>
      </div>
    </div>

  </main>

  <script>
    let selectedPurpose = null;

    // 今日の日付をデフォルトに
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth()+1).padStart(2,'0');
    const dd = String(today.getDate()).padStart(2,'0');
    document.getElementById('travel_date').value = `${yyyy}-${mm}-${dd}`;

    function selectPurpose(btn) {
      document.querySelectorAll('.purpose-btn').forEach(b => {
        b.classList.remove('border-teal','text-teal','bg-teal/5');
        b.classList.add('border-gray-200','text-gray-600');
      });
      btn.classList.add('border-teal','text-teal','bg-teal/5');
      btn.classList.remove('border-gray-200','text-gray-600');
      selectedPurpose = btn.dataset.value;
      document.getElementById('purpose').value = selectedPurpose;
    }

    // 予算ラジオボタン スタイル
    document.querySelectorAll('.budget-opt input').forEach(radio => {
      radio.addEventListener('change', () => {
        document.querySelectorAll('.budget-label').forEach(l => {
          l.classList.remove('border-teal','text-teal');
          l.classList.add('border-gray-200','text-gray-500');
        });
        const lbl = radio.nextElementSibling;
        lbl.classList.add('border-teal','text-teal');
        lbl.classList.remove('border-gray-200','text-gray-500');
      });
    });

    document.getElementById('mainForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const origin = document.getElementById('origin').value.trim();
      const destination = document.getElementById('destination').value.trim();
      const purpose = document.getElementById('purpose').value;
      const travel_date = document.getElementById('travel_date').value;
      const nights = parseInt(document.getElementById('nights').value);
      const adults = parseInt(document.getElementById('adults').value);
      const children = document.getElementById('children').value.trim();
      const budget = document.querySelector('input[name="budget"]:checked')?.value || 'mid';

      if (!purpose) {
        alert('旅の目的を選んでください');
        return;
      }

      // ローディング表示
      document.getElementById('formSection').classList.add('hidden');
      document.getElementById('loadingSection').classList.remove('hidden');
      document.getElementById('resultSection').classList.add('hidden');
      document.getElementById('errorSection').classList.add('hidden');

      try {
        const res = await fetch('/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ origin, destination, purpose, travel_date, nights, adults, children, budget })
        });

        if (!res.ok) throw new Error(`サーバーエラー: ${res.status}`);
        const data = await res.json();

        // ルートサマリー
        document.getElementById('routeLabel').textContent = `${origin} → ${destination}`;
        document.getElementById('routeComment').textContent = data.route_comment || '';

        // エリアカード描画
        const container = document.getElementById('areaCards');
        container.innerHTML = '';
        data.areas.forEach((area, i) => {
          container.innerHTML += buildAreaCard(area, i);
        });

        document.getElementById('loadingSection').classList.add('hidden');
        document.getElementById('resultSection').classList.remove('hidden');

        // アニメーション
        document.querySelectorAll('.card-enter').forEach((el, i) => {
          el.style.animationDelay = `${i * 0.12}s`;
        });

      } catch(err) {
        document.getElementById('loadingSection').classList.add('hidden');
        document.getElementById('errorSection').classList.remove('hidden');
        document.getElementById('errorMsg').textContent = err.message;
      }
    });

    function buildAreaCard(area, index) {
      const rankColors = ['bg-teal text-white', 'bg-navy text-white', 'bg-gray-400 text-white'];
      const scoreColor = area.score >= 85 ? 'text-teal' : area.score >= 70 ? 'text-navy' : 'text-gray-600';
      const scoreBg = area.score >= 85 ? 'bg-teal/5 border-teal/20' : 'bg-gray-50 border-gray-200';
      const scoreBarColor = area.score >= 85 ? 'bg-teal' : area.score >= 70 ? 'bg-navy' : 'bg-gray-400';
      const priceLabel = {'budget':'節約','mid':'標準','premium':'プレミアム','luxury':'贅沢'}[area.price_range] || area.price_range;
      const tags = (area.tags || []).slice(0,4).map(t => `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-0.5 rounded-full">${t}</span>`).join('');
      const attractions = (area.attractions || []).slice(0,3).map(a => `<span>📍${a}</span>`).join('<span class="text-gray-300 mx-1">·</span>');
      const foods = (area.food || []).slice(0,3).map(f => `<span>🍴${f}</span>`).join('<span class="text-gray-300 mx-1">·</span>');

      const wishlistBadge = area.wishlist_match
        ? `<span class="text-xs bg-teal/10 text-teal px-2 py-0.5 rounded-full font-bold">あなたのリストにあります ⭐</span>`
        : '';

      const breakdown = area.score_breakdown ? `
        <div class="mt-3 grid grid-cols-3 gap-2 text-xs text-gray-500">
          <div class="text-center"><p class="text-gray-400">人気度</p><p class="font-bold text-gray-700">${area.score_breakdown.popularity}</p></div>
          <div class="text-center"><p class="text-gray-400">満足度</p><p class="font-bold text-gray-700">${area.score_breakdown.satisfaction}</p></div>
          <div class="text-center"><p class="text-gray-400">子連れ</p><p class="font-bold text-gray-700">${area.score_breakdown.family_fit}</p></div>
        </div>
      ` : '';

      return `
        <div class="card-enter bg-white border ${scoreBg} rounded-3xl p-5 shadow-sm">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="${rankColors[index]} text-xs font-black px-3 py-1 rounded-full">${area.rank}位</span>
              <span class="font-black text-gray-900 text-lg">${area.name}</span>
              <span class="text-xs text-gray-400">${area.prefecture}</span>
              ${wishlistBadge}
            </div>
            <div class="text-right shrink-0">
              <p class="${scoreColor} font-black text-2xl leading-none">${area.score}</p>
              <p class="text-gray-400 text-xs">点</p>
            </div>
          </div>

          <div class="score-bar mb-3">
            <div class="score-fill ${scoreBarColor}" style="width:${area.score}%"></div>
          </div>

          <p class="text-sm text-brand font-bold mb-2">✨ ${area.highlight || ''}</p>
          <p class="text-sm text-gray-600 leading-relaxed mb-3">${area.reason}</p>

          <div class="flex flex-wrap gap-1 mb-3">${tags}</div>

          <div class="border-t border-gray-100 pt-3 space-y-1.5">
            <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-gray-500">${attractions}</div>
            <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-gray-500">${foods}</div>
          </div>

          <div class="mt-3 flex items-center justify-between">
            <span class="text-xs text-gray-400">予算感：<span class="font-bold text-gray-600">${priceLabel}（${area.hotel_price_avg}円/人）</span></span>
            <button onclick="addToWishlist('${area.id}','${area.name}')"
              class="text-xs border border-gray-200 text-gray-500 hover:border-teal hover:text-teal px-3 py-1.5 rounded-full transition-colors font-bold">
              ⭐ リストに追加
            </button>
          </div>

          ${breakdown}
        </div>
      `;
    }

    function addToWishlist(id, name) {
      const list = JSON.parse(localStorage.getItem('tripos_wishlist') || '[]');
      if (!list.find(i => i.id === id)) {
        list.push({ id, name, added: new Date().toISOString().slice(0,10) });
        localStorage.setItem('tripos_wishlist', JSON.stringify(list));
        alert(`⭐ 「${name}」をリストに追加しました！`);
      } else {
        alert(`「${name}」はすでにリストにあります`);
      }
    }

    function resetForm() {
      document.getElementById('formSection').classList.remove('hidden');
      document.getElementById('resultSection').classList.add('hidden');
      document.getElementById('errorSection').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
